method: generated
vocabulary:
  provider: Thermal Power (EIA)
  description: >-
    Vocabulary and taxonomy for thermal power generation data APIs, covering
    fuel types, prime movers, grid regions, operational metrics, and technical
    measurement units used in thermal electricity generation.
  terms:
    - term: Thermal Power
      definition: >-
        Electricity generation using heat produced by burning fossil fuels
        (coal, natural gas, oil) or nuclear fission. Distinguished from
        renewable generation (wind, solar, hydro).
      tags:
        - Generation Type
        - Core Concept

    - term: Heat Rate
      definition: >-
        A measure of thermal efficiency representing the amount of energy
        input (BTU) required to produce one kilowatthour of electricity.
        Lower heat rate = higher efficiency. Typical values: coal 9,000-12,000 BTU/kWh,
        combined cycle gas 6,000-8,000 BTU/kWh.
      tags:
        - Performance Metric
        - Efficiency

    - term: Net Generation
      definition: >-
        The amount of electricity generated by a plant minus the electricity
        consumed by the plant's own equipment (station use). Measured in
        megawatthours (MWh).
      tags:
        - Generation Metric
        - Measurement

    - term: Nameplate Capacity
      definition: >-
        The maximum rated output of a generator as specified by the manufacturer,
        measured in megawatts (MW).
      tags:
        - Capacity Metric
        - Measurement

    - term: Net Summer Capacity
      definition: >-
        The maximum output a generator can sustain for one hour during the
        peak summer demand period, measured in MW. Typically lower than nameplate
        due to heat derating.
      tags:
        - Capacity Metric
        - Measurement

    - term: Prime Mover
      definition: >-
        The mechanical device that converts energy to rotational motion to
        drive a generator. Thermal prime movers include steam turbines (ST),
        gas turbines (GT), internal combustion engines (IC), and combined
        cycle configurations (CA/CS/CT).
      tags:
        - Technical Term
        - Equipment
      values:
        - ST: Steam turbine (coal, nuclear, geothermal boilers)
        - GT: Gas turbine (combustion turbine / peaker plant)
        - IC: Internal combustion engine (diesel, natural gas reciprocating)
        - CA: Combined cycle steam turbine portion
        - CS: Combined cycle single shaft
        - CT: Combined cycle turbine portion

    - term: Combined Cycle
      definition: >-
        A power plant configuration using both a gas turbine and a steam turbine.
        Waste heat from the gas turbine generates steam to drive the steam turbine,
        achieving efficiencies of 55-65% vs. 35-42% for simple cycle gas turbines.
      tags:
        - Technology
        - Natural Gas

    - term: Heat Content
      definition: >-
        The thermal energy value of a fuel, measured in British Thermal Units (BTU)
        or million BTU (MMBtu). Used to calculate heat rates and compare fuels on
        an energy-equivalent basis.
      tags:
        - Measurement
        - Fuel Data

    - term: RTO / ISO
      definition: >-
        Regional Transmission Organization or Independent System Operator.
        Organizations that coordinate, control, and monitor electric power
        transmission grids across multi-state regions.
      tags:
        - Grid Operations
        - Market
      values:
        - MISO: Midcontinent Independent System Operator
        - PJM: PJM Interconnection
        - CAISO: California Independent System Operator
        - ERCOT: Electric Reliability Council of Texas
        - SPP: Southwest Power Pool
        - NYISO: New York Independent System Operator
        - ISONE: ISO New England

    - term: EIA Plant Code
      definition: >-
        The unique numeric identifier assigned by the U.S. Energy Information
        Administration to each power generation facility in the United States.
      tags:
        - Identifier
        - EIA

    - term: Fuel Type Codes
      definition: >-
        EIA standardized codes for fuel types used in thermal power generation.
      tags:
        - Fuel
        - Codes
      values:
        - COL: Coal (bituminous, subbituminous, lignite, anthracite)
        - NG: Natural Gas
        - DFO: Distillate Fuel Oil (diesel, heating oil)
        - RFO: Residual Fuel Oil (heavy fuel oil)
        - NUC: Nuclear (uranium)
        - PEL: Petroleum Liquids (aggregated)
        - ALL: All fuel types

  domains:
    - name: Generation Operations
      description: Operational data from thermal power generation assets.
      concepts:
        - Net Generation
        - Heat Rate
        - Fuel Consumption
        - Heat Content
        - Capacity Factor

    - name: Generating Assets
      description: Physical thermal power generation equipment.
      concepts:
        - Power Plant
        - Generator
        - Prime Mover
        - Nameplate Capacity
        - Net Summer Capacity
        - Net Winter Capacity

    - name: Grid Operations
      description: Real-time and near-real-time grid operations data.
      concepts:
        - RTO
        - ISO
        - Hourly Generation
        - Fuel Mix
        - Dispatch

    - name: Fuel Types
      description: Fuel categories used in thermal power generation.
      concepts:
        - Coal
        - Natural Gas
        - Petroleum
        - Nuclear
        - Combined Cycle
        - Simple Cycle
