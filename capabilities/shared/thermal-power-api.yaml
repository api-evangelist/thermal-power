naftiko: "1.0.0-alpha1"

info:
  label: "Thermal Power API"
  description: "EIA Open Data API for thermal power generation operational data including plant-level metrics, fuel consumption, heat rates, and generating capacity for coal, natural gas, petroleum, and nuclear assets."
  tags:
    - Energy
    - Thermal Power
    - Power Generation
    - Electricity
    - EIA
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      EIA_API_KEY: EIA_API_KEY

capability:
  consumes:
    - type: http
      namespace: thermal-power
      baseUri: https://api.eia.gov/v2
      description: "EIA Open Data API v2 for thermal power generation data."
      authentication:
        type: apikey
        key: api_key
        value: "{{EIA_API_KEY}}"
        placement: query
      resources:
        - name: electric-power-operational-data
          path: /electricity/electric-power-operational-data/data
          description: "Aggregated electric power operational data by state, sector, and fuel type."
          operations:
            - name: get-electric-power-operational-data
              method: GET
              description: "Retrieve electric power generation and fuel consumption by fuel type and state."
              inputParameters:
                - name: frequency
                  in: query
                  type: string
                  required: false
                  description: "Data frequency (monthly, quarterly, annual)."
                - name: "data[]"
                  in: query
                  type: string
                  required: false
                  description: "Data columns to return."
                - name: "facets[fueltypeid][]"
                  in: query
                  type: string
                  required: false
                  description: "Fuel type filter (COL, NG, PEL, NUC, ALL)."
                - name: "facets[location][]"
                  in: query
                  type: string
                  required: false
                  description: "State abbreviation filter."
                - name: start
                  in: query
                  type: string
                  required: false
                  description: "Start period YYYY-MM."
                - name: end
                  in: query
                  type: string
                  required: false
                  description: "End period YYYY-MM."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset."
                - name: length
                  in: query
                  type: integer
                  required: false
                  description: "Records to return (max 5000)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: facility-fuel
          path: /electricity/facility-fuel/data
          description: "Plant-level fuel consumption and generation data."
          operations:
            - name: get-facility-fuel-data
              method: GET
              description: "Retrieve plant-level generation, fuel consumption, heat content, and heat rate."
              inputParameters:
                - name: frequency
                  in: query
                  type: string
                  required: false
                  description: "Data frequency (monthly, annual)."
                - name: "data[]"
                  in: query
                  type: string
                  required: false
                  description: "Data columns to return."
                - name: "facets[plantCode][]"
                  in: query
                  type: string
                  required: false
                  description: "EIA plant code filter."
                - name: "facets[fuel2002][]"
                  in: query
                  type: string
                  required: false
                  description: "Fuel type code filter."
                - name: "facets[state][]"
                  in: query
                  type: string
                  required: false
                  description: "State abbreviation filter."
                - name: start
                  in: query
                  type: string
                  required: false
                  description: "Start period YYYY-MM."
                - name: end
                  in: query
                  type: string
                  required: false
                  description: "End period YYYY-MM."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset."
                - name: length
                  in: query
                  type: integer
                  required: false
                  description: "Records to return."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: generator-capacity
          path: /electricity/operating-generator-capacity/data
          description: "Individual generator nameplate and net capacity data."
          operations:
            - name: get-operating-generator-capacity
              method: GET
              description: "Retrieve generator capacity, prime mover type, and energy source for thermal generating units."
              inputParameters:
                - name: frequency
                  in: query
                  type: string
                  required: false
                  description: "Data frequency (monthly, annual)."
                - name: "data[]"
                  in: query
                  type: string
                  required: false
                  description: "Data columns to return."
                - name: "facets[energy_source_code][]"
                  in: query
                  type: string
                  required: false
                  description: "Energy source code filter."
                - name: "facets[prime_mover_code][]"
                  in: query
                  type: string
                  required: false
                  description: "Prime mover code filter (ST, GT, IC, CA, CS)."
                - name: "facets[stateid][]"
                  in: query
                  type: string
                  required: false
                  description: "State abbreviation filter."
                - name: start
                  in: query
                  type: string
                  required: false
                  description: "Start period."
                - name: end
                  in: query
                  type: string
                  required: false
                  description: "End period."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset."
                - name: length
                  in: query
                  type: integer
                  required: false
                  description: "Records to return."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: rto-fuel-type
          path: /electricity/rto/fuel-type-data/data
          description: "Hourly RTO/ISO generation by fuel type."
          operations:
            - name: get-rto-fuel-type-data
              method: GET
              description: "Retrieve hourly net generation by fuel type for RTOs and ISOs."
              inputParameters:
                - name: frequency
                  in: query
                  type: string
                  required: false
                  description: "Data frequency (hourly, local-hourly)."
                - name: "data[]"
                  in: query
                  type: string
                  required: false
                  description: "Data columns to return."
                - name: "facets[respondent][]"
                  in: query
                  type: string
                  required: false
                  description: "RTO/ISO identifier (MISO, PJM, CAISO, ERCOT, SPP, NYISO, ISONE)."
                - name: "facets[fueltype][]"
                  in: query
                  type: string
                  required: false
                  description: "Fuel type filter (NG, COL, OIL, NUC)."
                - name: start
                  in: query
                  type: string
                  required: false
                  description: "Start datetime YYYY-MM-DDTHH."
                - name: end
                  in: query
                  type: string
                  required: false
                  description: "End datetime YYYY-MM-DDTHH."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset."
                - name: length
                  in: query
                  type: integer
                  required: false
                  description: "Records to return."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: thermal-power-rest
      resources:
        - path: /v1/electric-power/operational-data
          name: electric-power-operational-data
          description: "Aggregated electric power operational data by state and fuel type."
          operations:
            - method: GET
              name: get-electric-power-operational-data
              description: "Get electric power generation by fuel type and state."
              call: "thermal-power.get-electric-power-operational-data"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/plants/{plantCode}/fuel-data
          name: facility-fuel-data
          description: "Plant-level fuel and generation data."
          operations:
            - method: GET
              name: get-facility-fuel-data
              description: "Get plant-level generation and fuel metrics."
              call: "thermal-power.get-facility-fuel-data"
              with:
                "facets[plantCode][]": "rest.plantCode"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/generators/capacity
          name: generator-capacity
          description: "Generator capacity data."
          operations:
            - method: GET
              name: get-generator-capacity
              description: "Get thermal generator capacity and technical characteristics."
              call: "thermal-power.get-operating-generator-capacity"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/rto/fuel-type
          name: rto-fuel-type
          description: "Hourly RTO generation by fuel type."
          operations:
            - method: GET
              name: get-rto-fuel-type-data
              description: "Get hourly generation by RTO and fuel type."
              call: "thermal-power.get-rto-fuel-type-data"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: thermal-power-mcp
      transport: http
      tools:
        - name: get-electric-power-operational-data
          description: "Get aggregated electric power generation and fuel consumption by state, sector, and fuel type."
          hints:
            readOnly: true
            idempotent: true
          call: "thermal-power.get-electric-power-operational-data"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-facility-fuel-data
          description: "Get plant-level generation, fuel consumption, heat content, and heat rate data for thermal power plants."
          hints:
            readOnly: true
            idempotent: true
          call: "thermal-power.get-facility-fuel-data"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-generator-capacity
          description: "Get individual generator capacity, prime mover type, and energy source for thermal generating units."
          hints:
            readOnly: true
            idempotent: true
          call: "thermal-power.get-operating-generator-capacity"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-rto-hourly-generation
          description: "Get hourly net generation by fuel type for RTOs and ISOs including thermal sources."
          hints:
            readOnly: true
            idempotent: true
          call: "thermal-power.get-rto-fuel-type-data"
          outputParameters:
            - type: object
              mapping: "$."
